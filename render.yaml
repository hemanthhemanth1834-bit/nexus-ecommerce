services:
  - type: web
    name: nexus-ecommerce
    runtime: node
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npx prisma migrate deploy && npx tsx src/seed.ts && cd ../client && npm install && npm run build
    startCommand: cd server && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: CORS_ORIGIN
        value: "*"
